name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # the four tool deps resolve from the npm registry, with integrity
      # checked against the lockfile; --foreground-scripts surfaces any
      # install-script failure
      - run: npm install --foreground-scripts
      - run: npm test
      - run: npm run typecheck
      - name: the study runs and reports
        run: npm run study
